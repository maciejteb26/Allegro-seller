# Render Blueprint — backend + frontend (baza: Supabase)
# Instrukcja Supabase: docs/SUPABASE.md
# Szablon env: .env.supabase.example

services:
  - type: web
    name: szybkiewystawianie-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: CLIENT_URL
        fromService:
          name: szybkiewystawianie-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: S3_BUCKET
        value: szybkiewystawianie
      - key: S3_REGION
        value: eu-central-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: ALLEGRO_MOCK
        value: "true"
      - key: ALLEGRO_SANDBOX
        value: "true"
      - key: ALLEGRO_REDIRECT_URI
        sync: false

  - type: web
    name: szybkiewystawianie-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace=client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: szybkiewystawianie-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
