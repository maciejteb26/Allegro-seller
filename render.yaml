# Render Blueprint — https://render.com/docs/blueprint-spec
# Po podłączeniu repo w Render Dashboard wybierz "Apply Blueprint".
#
# Po pierwszym deployu uzupełnij ręcznie (sync: false):
#   ENCRYPTION_KEY — dokładnie 32 znaki
#   S3_* — bucket obiektowy (Cloudflare R2 lub AWS S3)
# Następnie uruchom seed (jednorazowo):
#   npm run prisma:seed --workspace=server  (z DATABASE_URL produkcyjnym)

databases:
  - name: szybkiewystawianie-db
    plan: free
    databaseName: szybkiewystawianie
    user: szybkiewystawianie

services:
  - type: web
    name: szybkiewystawianie-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: szybkiewystawianie-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: szybkiewystawianie-db
          property: connectionString
      - key: CLIENT_URL
        fromService:
          name: szybkiewystawianie-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: ALLEGRO_MOCK
        value: "true"
      - key: ALLEGRO_SANDBOX
        value: "true"
      - key: ALLEGRO_REDIRECT_URI
        sync: false
        # Ustaw w dashboardzie, np.:
        # https://szybkiewystawianie-api.onrender.com/api/platforms/allegro/oauth/callback

  - type: web
    name: szybkiewystawianie-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace=client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: szybkiewystawianie-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
