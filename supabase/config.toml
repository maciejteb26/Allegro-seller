# Supabase CLI — lokalny stack (opcjonalny zamiast docker-compose Postgres+MinIO)
# Instalacja: https://supabase.com/docs/guides/cli
# Start: supabase start  →  supabase status -o env

project_id = "szybkiewystawianie-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
