name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: allegro_seller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=server

      - name: Typecheck server
        run: npx tsc --noEmit --project server/tsconfig.json

      - name: Typecheck client
        run: npx tsc --noEmit --project client/tsconfig.json

      - name: Test server
        run: npm run test --workspace=server

      - name: Integration tests (server)
        run: npm run test:int --workspace=server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/allegro_seller_test

      - name: Test client
        run: npm run test --workspace=client

      - name: Build
        run: npm run build
